name: Update Streamlit application index

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-streamlit-application-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover live Streamlit applications and rebuild the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_streamlit_index.py

      - name: Commit an index refresh when there is a change
        run: |
          if git diff --quiet -- _data/streamlit_apps.json streamlit-apps.md; then
            echo "The Streamlit application index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/streamlit_apps.json streamlit-apps.md
          git commit -m "Refresh Streamlit application index"
          git push
